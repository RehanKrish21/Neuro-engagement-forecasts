[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroengage"
version = "0.1.0"
description = "Forecast video engagement and drop-off from TRIBE v2 predicted brain responses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
parquet = ["pyarrow>=14"]

[project.scripts]
neuroengage = "neuroengage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
